# Publishes the image of main to ghcr.io/tim-smart/chad. The gate does not run here: a commit reaches main through a
# pull request the gate has passed. The built-in GITHUB_TOKEN is the only secret this reads.
name: publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# One publish at a time, in the order of the pushes, so the moving tags end on the newest commit. A push that arrives
# while another waits replaces the one waiting, so a commit in the middle of a burst can go without its own tag.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  image:
    name: image for amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(jq -er .version package.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Three tags: main, which always moves and is what a deployment follows, chad's version, which moves with main
      # until the version changes, and the commit, as sha-<short>, which never moves.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
