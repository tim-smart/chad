# Publishes the image of main to ghcr.io/tim-smart/chad. The gate does not run here: a commit reaches main through a
# pull request the gate has passed. The built-in GITHUB_TOKEN is the only secret this reads.
name: publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Every push builds, with no lock, so every commit of main gets its own tag whatever else is running.
  image:
    name: image for amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The labels, which name the repository and the commit.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      # The commit's tag, sha- and its first seven characters, which no other commit writes.
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Moves the tags that move: main, which a deployment follows, and chad's version. It does not go by the commit of
  # its own run. It reads the head of main once it holds the lock and moves the tags to that commit's image, so a run
  # that is late, or run again, cannot move them back.
  # GitHub keeps one waiting job for a group and cancels the one it replaces, which loses nothing here: the job that
  # takes its place does the same work.
  # The job fails whenever it does not move both tags, and never passes over a commit quietly. That includes a head
  # whose image is not there yet because its own run is still building. That run then moves them.
  promote:
    name: move main and the version tag
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: publish-promote
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          head=$(git rev-parse HEAD)
          version=$(jq -er .version package.json)
          source="$IMAGE:sha-${head::7}"
          # A copy as it is, so the tags it moves have the digest of the commit's tag.
          if ! docker buildx imagetools create --prefer-index=false --tag "$IMAGE:main" --tag "$IMAGE:$version" "$source"; then
            echo "::error::main and $version were not both moved to $source. When the run of $head is still building, it moves them. Otherwise run this job again once that image exists."
            exit 1
          fi
