# The pull request gate: layers 1 to 4, the image layer on amd64,
# the type-check, the linter and the formatter. Nothing here reads a secret.
name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: type-check, lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm tsc --noEmit
      - run: pnpm oxlint
      - run: pnpm prettier --check .

  layers:
    name: layers 1 to 4
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # A scenario that passed removed its directory, so what is left is each failed one, database included.
      # tar keeps symlinks as links; upload-artifact otherwise follows repo/node_modules into the toolchain.
      - name: Archive failed scenarios without following symlinks
        if: failure()
        run: find /tmp -maxdepth 1 -type d -name 'chad-*' -printf '%f\0' | tar -czf "$RUNNER_TEMP/failed-scenarios.tar.gz" -C /tmp --null -T -
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failed-scenarios
          path: ${{ runner.temp }}/failed-scenarios.tar.gz

  image:
    name: image layer on amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --project image
      # A failed image scenario left what its two containers wrote, with the daemon's log and the database.
      - name: Archive failed image scenarios without following symlinks
        if: failure()
        run: find /tmp -maxdepth 1 -type d -name 'chad-*' -printf '%f\0' | tar -czf "$RUNNER_TEMP/failed-image-scenarios.tar.gz" -C /tmp --null -T -
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failed-image-scenarios
          path: ${{ runner.temp }}/failed-image-scenarios.tar.gz
