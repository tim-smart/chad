# The weekly dependency job of docs/spec/17-testing.md. It runs layers 1 to 4 and the image layer against the newest
# effect snapshot and the newest clanka, opens an issue when it fails, and gates nothing.
name: weekly

on:
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch:
  # A schedule fires only from the default branch. Until the build's pull request is merged, a push to the shared
  # branch that changes the trigger file runs the job. The last stage removes this trigger.
  push:
    branches: [chad-v1]
    paths: [.github/triggers/weekly]

permissions:
  contents: read
  issues: write

jobs:
  dependencies:
    name: newest effect snapshot and clanka
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same script a real upgrade uses. It writes the tarballs under vendor/ and installs from there.
      - run: node scripts/vendor.ts --newest --clanka newest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm test
      # The pnpm settings name the clanka version, so the image is built and booted on the new set as well.
      - run: pnpm vitest run --project image
      - if: failure()
        run: |
          title="The weekly dependency job failed"
          body="The weekly job failed on the newest effect snapshot or the newest clanka: $RUN"
          number=$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
