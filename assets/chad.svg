    <!-- throat and far shoulder in shadow -->
    <path d="M196 352 C214 372 232 410 244 452 L250 490 L410 490 L410 448 C374 424 326 412 302 398 C286 386 284 360 284 330 Z" fill="#474744"/>
    <path d="M290 392 C316 408 362 422 410 448 L410 490 L300 490 C292 456 288 424 290 392 Z" fill="#2b2b29"/>
    <!-- sternomastoid edge -->
    <path d="M140 286 C150 300 160 314 172 326 C160 322 148 312 138 300 Z" fill="#8d8d88"/>
    <!-- collarbones -->
    <path d="M150 474 C176 462 204 460 230 466" stroke="#8d8d88" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M262 468 C290 456 320 456 344 464" stroke="#0c0c0c" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- face, lit -->
