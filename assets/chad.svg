<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="200" height="240" role="img" aria-label="chad: a black-and-white portrait of a bearded, square-jawed man in three-quarter view with a slight grin">
  <defs>
    <radialGradient id="halo" cx="46%" cy="36%" r="58%">
      <stop offset="0" stop-color="#5a5a57"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </radialGradient>
    <clipPath id="tile"><rect width="400" height="480" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="400" height="480" fill="url(#halo)"/>

    <!-- neck + shoulders, lit -->
    <path d="M108 236 C104 300 100 342 58 378 C34 398 4 410 -10 432 L-10 490 L410 490 L410 448 C374 424 326 412 302 398 C286 386 284 360 284 330 Z" fill="#f1f1eb"/>
