# The nightly backups, to the chad-backup claim. Each night writes chad-<date>.tar and asphodel-<date>.db, and nothing
# removes old ones.
#
# chad's backup mounts the data claim itself and needs no affinity to chad's pod, so it works while that pod is down.
# With chad running, it takes its place in chad's queue through the socket on the volume.
#
# This example is for a cluster of one node. ReadWriteOnce attaches a claim to one node at a time and does not schedule
# the job beside chad's pod. On several nodes a job that lands away from chad waits on the attachment while chad runs.
#
# Run one now with:
#
#   kubectl create job --from=cronjob/chad-backup chad-backup-now
#
# The restore is in docs/running.md: it goes onto an empty claim, with chad's pod stopped.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: chad-backup
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ghcr.io/tim-smart/chad
              command: ["/bin/sh", "-c"]
              args: ['exec chad backup "/backup/chad-$(date -u +%Y-%m-%d).tar"']
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: backup
                  mountPath: /backup
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: chad-data
            - name: backup
              persistentVolumeClaim:
                claimName: chad-backup
---
# asphodel's backup asks the running daemon for a checked copy of its store, so it needs chad's pod up.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: asphodel-backup
spec:
  schedule: "45 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ghcr.io/tim-smart/asphodel
              command: ["/bin/sh", "-c"]
              args:
                [
                  'exec asphodel backup --out="/backup/asphodel-$(date -u +%Y-%m-%d).db"',
                ]
              env:
                - name: ASPHODEL_URL
                  value: http://chad-asphodel:7720
                - name: ASPHODEL_TOKEN
                  valueFrom:
                    secretKeyRef: { name: chad-asphodel, key: token }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: chad-backup
---
# Only the asphodel-backup CronJob uses this. chad reaches asphodel on loopback inside its pod.
apiVersion: v1
kind: Service
metadata:
  name: chad-asphodel
spec:
  selector:
    app.kubernetes.io/name: chad
  ports:
    - name: asphodel
      port: 7720
      targetPort: asphodel
