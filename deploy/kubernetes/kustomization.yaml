# The Kubernetes example of docs/running.md: chad with asphodel as a native sidecar, the claims, and the nightly
# backups. Apply it with `kubectl apply -k deploy/kubernetes` after creating the Secret that claims.yaml names.
#
# The image tag below is the one variable the Deployment and the backup CronJob both take theirs from. It is chad's
# version with no prefix, the string `chad status` prints.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - claims.yaml
  - deployment.yaml
  - backup.yaml
images:
  - name: ghcr.io/tim-smart/chad
    newTag: "0.0.0"
  # asphodel tags each build with its commit. Pin one in place of latest.
  - name: ghcr.io/tim-smart/asphodel
    newTag: latest
