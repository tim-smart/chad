# chad, with asphodel as a native sidecar in the same pod.
#
# One replica and Recreate: a rollout stops the old pod before the new one starts, because a second chad on the same
# volume is refused the lock. Set chad up once the pod runs:
#
#   kubectl exec -it deploy/chad -- chad setup
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chad
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chad
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chad
    spec:
      automountServiceAccountToken: false
      # A stop waits up to 60 seconds for chad itself, and this leaves room past that.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        # fsGroup does nothing on a local-path volume, which the provisioner makes with mode 0777. There chad's own
        # start-up check is the guard: it refuses to boot on a volume another uid owns.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # A native sidecar (Kubernetes 1.29 and later): an init container that keeps running. chad's asphodel plugin
        # reaches it at http://127.0.0.1:7720, its default url.
        - name: asphodel
          image: ghcr.io/tim-smart/asphodel
          restartPolicy: Always
          args:
            - serve
            # Off loopback, so the asphodel-backup CronJob reaches it through the Service in backup.yaml. The token is
            # then required of every client.
            - --listen=0.0.0.0:7720
            - --data-dir=/data
          env:
            - name: ASPHODEL_TOKEN
              valueFrom:
                secretKeyRef: { name: chad-asphodel, key: token }
          ports:
            - name: asphodel
              containerPort: 7720
          securityContext:
            # asphodel's image runs as 65532. The pod's fsGroup gives it the claim.
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: asphodel
              mountPath: /data
      containers:
        - name: chad
          image: ghcr.io/tim-smart/chad
          env:
            # chad.json gives the asphodel plugin "token": "${ASPHODEL_TOKEN}". A name the secret store does not hold
            # comes from the environment, so this is the same token asphodel has.
            - name: ASPHODEL_TOKEN
              valueFrom:
                secretKeyRef: { name: chad-asphodel, key: token }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # A frozen chad is no crash, so only this probe restarts it. There is no readiness probe: nothing routes to
          # chad.
          livenessProbe:
            exec:
              command: ["chad", "health"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command: ["chad", "health"]
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /data
            # Add readOnly: true to keep chad from writing to it.
            - name: vault
              mountPath: /mnt/vault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chad-data
        - name: asphodel
          persistentVolumeClaim:
            claimName: chad-asphodel
        - name: vault
          persistentVolumeClaim:
            claimName: chad-vault
