#cloud-config
# User data for a new Ubuntu 24.04 server, such as a DigitalOcean Droplet. Paste it as it is: it holds no secret, so
# nothing in the server's metadata is worth reading. `docs/deploying.md` is the guide.
#
# The first boot installs Docker and Tailscale and fetches chad's deploy files. It joins nothing and starts no
# container. You do that over SSH afterwards, with `bash /opt/chad/install.sh`.
runcmd:
  - |
    set -eu
    curl -fsSL -o /root/install-chad.sh https://raw.githubusercontent.com/tim-smart/chad/main/deploy/install.sh
    bash /root/install-chad.sh prepare
